[[mods]]
modId = "mg_arcane"
version = "1.3.1"
displayName = "Modular Golems - Ars Integration"
logoFile = "logo.png"
authors = "Tygabeast"
description = '''
Adds Modular Golems parts, constructs and abilities for the materials of Ars Nouveau, Ars Elemental and Ars Elemancy:
Source Gem, the Fire/Water/Earth/Air/Conjuration/Abjuration/Manipulation essences, Anima, Silt/Lava/Mire/Cinder/Vapor/Tempest
essences and the Elemancer Shard. Constructs and golem parts are made at the Enchanting Apparatus.
Ars Elemental and Ars Elemancy are optional: the Anima, combination and shard materials only appear when those mods are installed.
Config: mg_arcane-common.toml.
'''

